name: Fetch DermaLens models and datasets
description: >
  Installs CPU PyTorch and the ml/ pins, downloads the requested published
  model versions (checked against the hashes pinned in backend/app/registry.py)
  and both datasets (checked against their publishers' checksums) into
  $RUNNER_TEMP/ham and $RUNNER_TEMP/pad.
inputs:
  models:
    description: "Comma-separated model versions to download, e.g. v1,v2"
    required: true
runs:
  using: composite
  steps:
    - name: Install CPU PyTorch and the ml/ pins
      shell: bash
      run: |
        pip install --index-url https://download.pytorch.org/whl/cpu \
          "$(grep '^torch==' ml/requirements.txt)" "$(grep '^torchvision==' ml/requirements.txt)"
        grep -v '^torch' ml/requirements.txt > /tmp/ml-rest.txt
        pip install -r /tmp/ml-rest.txt

    - name: Download models (checked against the pinned hashes)
      shell: bash
      env:
        VERSIONS: ${{ inputs.models }}
      run: |
        PYTHONPATH=backend python - <<'EOF'
        import os
        from pathlib import Path
        from app.registry import PINNED_SHA256, fetch_releases

        versions = [v.strip() for v in os.environ["VERSIONS"].split(",") if v.strip()]
        unknown = [v for v in versions if v not in PINNED_SHA256]
        if unknown:
            raise SystemExit(f"no pinned hashes for {unknown}")
        base = "https://github.com/SahilGBhuva/DermaLens/releases/download"
        fetch_releases(Path("models"), [(v, f"{base}/model-{v}") for v in versions])
        for version in versions:
            for name in PINNED_SHA256[version]:
                if not (Path("models") / version / name).exists():
                    raise SystemExit(f"models/{version}/{name} missing or failed its hash check")
        print("models verified:", versions)
        EOF

    - name: Download HAM10000 (checked against Dataverse's MD5)
      shell: bash
      run: |
        set -euo pipefail
        D="$RUNNER_TEMP/ham"
        mkdir -p "$D/images"
        A=https://dataverse.harvard.edu/api/access/datafile
        # Dataverse's published MD5 is for the original upload, so fetch that format.
        curl -fsSL --retry 3 -o "$D/metadata.csv" "$A/4338392?format=original"
        echo "8f85fb1aa29d80a2797247e434deb79d  $D/metadata.csv" | md5sum -c -
        while read -r id hash; do
          curl -fsSL --retry 3 -o "$D/part.zip" "$A/$id"
          echo "$hash  $D/part.zip" | md5sum -c -
          unzip -q -j -o "$D/part.zip" '*.jpg' -d "$D/images"
          rm "$D/part.zip"
        done <<'PARTS'
        3172585 4639bfa73ab251610530a97c898e6e46
        3172584 da43d6cc50f6613013be07e8986b384b
        PARTS
        echo "HAM10000 images: $(ls "$D/images" | wc -l)"

    - name: Download PAD-UFES-20 (checked against Mendeley's SHA-256)
      shell: bash
      run: |
        set -euo pipefail
        D="$RUNNER_TEMP/pad"
        mkdir -p "$D/images"
        M=https://data.mendeley.com/public-files/datasets/zr7vgbcyr2/files
        curl -fsSL --retry 3 -o "$D/metadata.csv" "$M/fa850265-57da-48f0-ba3e-998b3e44b1f6/file_downloaded"
        echo "14d145235cedb022548257acb0d84dcd949e2c916f65d2baa7c38ed5339e9527  $D/metadata.csv" | sha256sum -c -
        while read -r id hash; do
          curl -fsSL --retry 3 -o "$D/part.zip" "$M/$id/file_downloaded"
          echo "$hash  $D/part.zip" | sha256sum -c -
          unzip -q -j -o "$D/part.zip" '*.png' -d "$D/images"
          rm "$D/part.zip"
        done <<'PARTS'
        1cc2f71f-20a2-412d-b746-a9b9bc20c966 0ab44f60938bf57445e12f518a8878954cc734e6b0aec6d01194e2d26b4b2dca
        559a60ed-5504-475d-996c-6a8bc253b5e7 e2d9a3cbd58e823f5ae33163c48643e7d1b54ae3f9e145f01f8e9f16a363a60b
        34dcdf8e-e5f1-4b35-aa0b-5135051ff852 ecc4ef10143a43e1d01cb736773148607a78b530417eb76f2c38ad24bf5d0d2c
        PARTS
        echo "PAD-UFES-20 images: $(ls "$D/images" | wc -l)"
        df -h "$RUNNER_TEMP" | tail -1
