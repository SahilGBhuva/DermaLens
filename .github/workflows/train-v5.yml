name: Train v5 (adds BCN20000 training lesions)

# v5 = the v4 recipe plus one change: a lesion-grouped part of BCN20000
# (Hospital Clinic Barcelona) joins the training mix and the dermoscopy
# validation set. Pre-registered success criteria, per-class gates and the
# stated loss of BCN20000 as an outside test: docs/ROADMAP.md, "v5
# pre-registration". Started by hand; results stay an artifact until reviewed.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Maximum fine-tuning epochs"
        default: "15"
      ham_replay:
        description: "HAM10000 train images mixed in"
        default: "5000"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: ./.github/actions/fetch-data
        with:
          models: v2,v3

      - name: Fetch BCN20000 and split it by lesion
        run: |
          set -euo pipefail
          python ml/prepare_bcn20000.py --output-dir "$RUNNER_TEMP/bcn"
          python ml/split_bcn20000.py --metadata "$RUNNER_TEMP/bcn/metadata.csv" \
            --images-dir "$RUNNER_TEMP/bcn/images" --output-dir "$RUNNER_TEMP/bcn_splits"

      - name: Train, fit decisions and test v5
        env:
          EPOCHS: ${{ inputs.epochs }}
          HAM_REPLAY: ${{ inputs.ham_replay }}
        run: |
          python ml/run_v3_pipeline.py --version v5 --decision concern \
            --ham-metadata "$RUNNER_TEMP/ham/metadata.csv" --ham-images "$RUNNER_TEMP/ham/images" \
            --pad-metadata "$RUNNER_TEMP/pad/metadata.csv" --pad-images "$RUNNER_TEMP/pad/images" \
            --bcn-splits "$RUNNER_TEMP/bcn_splits" \
            --epochs "$EPOCHS" --patience 4 --ham-replay "$HAM_REPLAY" \
            --compare-models models/v2,models/v3 \
            --work-dir "$RUNNER_TEMP/v5" --output-dir models/v5

      - name: Score the held-out BCN20000 lesions once (v2, v3, v5)
        run: |
          set -euo pipefail
          (cd ml && python evaluate_external.py --dataset bcn20000 \
            --metadata "$RUNNER_TEMP/bcn_splits/test.csv" --images-dir "$RUNNER_TEMP/bcn/images" \
            --models ../models/v2,../models/v3,../models/v5 \
            --output ../models/v5/bcn20000_heldout_lesions.json \
            --predictions ../models/v5/bcn20000_heldout_lesions_predictions.csv)
          cp "$RUNNER_TEMP/bcn_splits/split_summary.json" models/v5/bcn_split_summary.json

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          ham = json.load(open("models/v5/evaluation.json"))
          pad = json.load(open("models/v5/pad_ufes_20_test.json"))
          bcn = json.load(open("models/v5/bcn20000_heldout_lesions.json"))
          print("## v5 (each test split scored once)\n")
          cf = ham.get("concern_flag", {})
          print(f"**HAM10000 test:** balanced accuracy {ham['balanced_accuracy']:.3f}, ECE {ham['expected_calibration_error']:.3f}, "
                f"flag catches {cf.get('sensitivity')}, benign unflagged {cf.get('specificity')}\n")
          for name, d in (("PAD-UFES-20 test patients", pad), ("BCN20000 held-out lesions (same hospital as training)", bcn)):
              print(f"**{name}:**\n\n| Model | Balanced accuracy | Flag catches | Benign unflagged |\n|---|---|---|---|")
              for v, m in d["models"].items():
                  c = m["concerning_lesions"]
                  print(f"| {v} | {m['balanced_accuracy']:.3f} | {c['sensitivity']:.3f} | {c['specificity']:.3f} |")
              print()
              for v, m in d["models"].items():
                  if "flagged_by_code" in m:
                      print(f"Flagged by code, {v}: " + ", ".join(f"{k} {x['flagged']:.3f}" for k, x in m["flagged_by_code"].items()) + "\n")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dermalens-v5
          path: models/v5/
          retention-days: 90
