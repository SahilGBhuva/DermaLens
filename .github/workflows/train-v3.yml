name: Train v3 (dermoscopy + smartphone photos)

# Fine-tunes v2 on PAD-UFES-20 smartphone photos plus a HAM10000 replay
# sample, calibrates on validation, and scores each test split once
# (ml/run_v3_pipeline.py). Runs on a GitHub runner (CPU), so neither dataset
# touches a laptop. The trained files are kept as a workflow artifact; nothing
# is published until a person reviews the results. Started by hand.
#
# Data: HAM10000 (Harvard Dataverse doi:10.7910/DVN/DBW86T, CC BY-NC 4.0)
# and PAD-UFES-20 (Mendeley Data doi:10.17632/zr7vgbcyr2.1, CC BY 4.0).
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Maximum fine-tuning epochs"
        default: "8"
      ham_replay:
        description: "HAM10000 train images mixed in"
        default: "3000"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and the ml/ pins
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "$(grep '^torch==' ml/requirements.txt)" "$(grep '^torchvision==' ml/requirements.txt)"
          grep -v '^torch' ml/requirements.txt > /tmp/ml-rest.txt
          pip install -r /tmp/ml-rest.txt

      - name: Download v1 and v2 (checked against the pinned hashes)
        run: |
          PYTHONPATH=backend python - <<'EOF'
          from pathlib import Path
          from app.registry import PINNED_SHA256, fetch_releases

          base = "https://github.com/SahilGBhuva/DermaLens/releases/download"
          fetch_releases(Path("models"), [(v, f"{base}/model-{v}") for v in ("v1", "v2")])
          for version, files in PINNED_SHA256.items():
              for name in files:
                  if not (Path("models") / version / name).exists():
                      raise SystemExit(f"models/{version}/{name} missing or failed its hash check")
          print("models verified")
          EOF

      - name: Download HAM10000 (checked against Dataverse's MD5)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/ham"
          mkdir -p "$D/images"
          A=https://dataverse.harvard.edu/api/access/datafile
          # The ingested .tab version is the one Dataverse publishes a checksum for.
          curl -fsSL --retry 3 -o "$D/metadata.tab" "$A/4338392"
          echo "8f85fb1aa29d80a2797247e434deb79d  $D/metadata.tab" | md5sum -c -
          python -c "import pandas as pd, sys; pd.read_csv(sys.argv[1], sep='\t').to_csv(sys.argv[2], index=False)" \
            "$D/metadata.tab" "$D/metadata.csv"
          while read -r id hash; do
            curl -fsSL --retry 3 -o "$D/part.zip" "$A/$id"
            echo "$hash  $D/part.zip" | md5sum -c -
            unzip -q -j -o "$D/part.zip" '*.jpg' -d "$D/images"
            rm "$D/part.zip"
          done <<'PARTS'
          3172585 4639bfa73ab251610530a97c898e6e46
          3172584 da43d6cc50f6613013be07e8986b384b
          PARTS
          echo "HAM10000 images: $(ls "$D/images" | wc -l)"

      - name: Download PAD-UFES-20 (checked against Mendeley's SHA-256)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/pad"
          mkdir -p "$D/images"
          M=https://data.mendeley.com/public-files/datasets/zr7vgbcyr2/files
          curl -fsSL --retry 3 -o "$D/metadata.csv" "$M/fa850265-57da-48f0-ba3e-998b3e44b1f6/file_downloaded"
          echo "14d145235cedb022548257acb0d84dcd949e2c916f65d2baa7c38ed5339e9527  $D/metadata.csv" | sha256sum -c -
          while read -r id hash; do
            curl -fsSL --retry 3 -o "$D/part.zip" "$M/$id/file_downloaded"
            echo "$hash  $D/part.zip" | sha256sum -c -
            unzip -q -j -o "$D/part.zip" '*.png' -d "$D/images"
            rm "$D/part.zip"
          done <<'PARTS'
          1cc2f71f-20a2-412d-b746-a9b9bc20c966 0ab44f60938bf57445e12f518a8878954cc734e6b0aec6d01194e2d26b4b2dca
          559a60ed-5504-475d-996c-6a8bc253b5e7 e2d9a3cbd58e823f5ae33163c48643e7d1b54ae3f9e145f01f8e9f16a363a60b
          34dcdf8e-e5f1-4b35-aa0b-5135051ff852 ecc4ef10143a43e1d01cb736773148607a78b530417eb76f2c38ad24bf5d0d2c
          PARTS
          echo "PAD-UFES-20 images: $(ls "$D/images" | wc -l)"
          df -h "$RUNNER_TEMP" | tail -1

      - name: Train, calibrate and test v3
        env:
          EPOCHS: ${{ inputs.epochs }}
          HAM_REPLAY: ${{ inputs.ham_replay }}
        run: |
          python ml/run_v3_pipeline.py \
            --ham-metadata "$RUNNER_TEMP/ham/metadata.csv" --ham-images "$RUNNER_TEMP/ham/images" \
            --pad-metadata "$RUNNER_TEMP/pad/metadata.csv" --pad-images "$RUNNER_TEMP/pad/images" \
            --epochs "$EPOCHS" --ham-replay "$HAM_REPLAY" \
            --work-dir "$RUNNER_TEMP/v3" --output-dir models/v3
          cp "$RUNNER_TEMP/v3/pad_splits/"{train,val,test}.csv "$RUNNER_TEMP/v3/pad_splits/split_summary.json" models/v3/
          sed -i "s#$RUNNER_TEMP/v3/pad_splits/images/##" models/v3/{train,val,test}.csv

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          ham = json.load(open("models/v3/evaluation.json"))
          pad = json.load(open("models/v3/pad_ufes_20_test.json"))
          print("## v3 results (each test split scored once)\n")
          mel = ham["per_class_sensitivity_specificity"]["mel"]["sensitivity"]
          print(f"**HAM10000 test (dermoscopy):** balanced accuracy {ham['balanced_accuracy']:.3f}, "
                f"melanoma sensitivity {mel:.3f}, ECE {ham['expected_calibration_error']:.3f} "
                "(v2: 0.733, 0.781, 0.315)\n")
          print("**PAD-UFES-20 test patients (smartphone):**\n")
          print("| Model | Images | Balanced accuracy | Melanoma sensitivity | Calibration error | Concerning flagged |")
          print("|---|---|---|---|---|---|")
          for v, m in pad["models"].items():
              print(f"| {v} | {m['images_scored']} | {m['balanced_accuracy']:.3f} | {m['melanoma_sensitivity']:.3f} | "
                    f"{m['expected_calibration_error']:.3f} | {m['concerning_lesions']['sensitivity']:.3f} |")
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dermalens-v3
          path: models/v3/
          retention-days: 90
