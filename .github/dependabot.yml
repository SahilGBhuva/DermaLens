# Weekly pull requests for security and version updates.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # numpy 2.3+ needs Python 3.12; the API image runs 3.11 (see docs/ROADMAP.md).
      - dependency-name: numpy
        versions: [">=2.3"]
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
    # The ml/ pins are the exact versions v1 and v2 were trained with, so
    # results stay reproducible. 0 turns off version-update PRs only;
    # Dependabot still opens security-update PRs and alerts.
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Major upgrades are planned by hand (see docs/ROADMAP.md), not merged weekly.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types should match the Node version the site runs on (20).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint and its rule packages move together, by hand.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release (security updates are not delayed).
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release (security updates are not delayed).
    cooldown:
      default-days: 7
