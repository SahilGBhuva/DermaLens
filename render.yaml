services:
  - type: web
    name: dermalens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Render's proxy appends the real client IP to X-Forwarded-For (rate limiting)
      - key: TRUST_PROXY_HEADERS
        value: "1"
      # Your Vercel site address, e.g. https://dermalens.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Direct download links to the trained files (e.g. GitHub Release assets)
      - key: MODEL_URL
        sync: false
      - key: CONFIG_URL
        sync: false
      - key: EVALUATION_URL
        sync: false
      # Optional: training_history.json, for the training curve on the Evidence page
      - key: HISTORY_URL
        sync: false
